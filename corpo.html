<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filosofia - Prof. Silvio Bonilha</title>
  
  <style>
    body {
      direction: ltr;
      background-color: #121212; /* Preto moderno/suave */
      max-width: 850px;
      margin: 40px auto;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 0 20px;
    }

    header {
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, #e6ff00 0%, #b8cc00 100%);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    header img {
      height: 90px;
      width: 80px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid rgba(0,0,0,0.1);
      margin-right: 20px;
    }

    header h2 {
      background-color: #cc9933;
      padding: 12px 25px;
      margin: 0;
      font-size: 1.8rem;
      flex: 1;
      text-align: right;
      border-radius: 8px;
      color: #fff;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
      letter-spacing: 0.5px;
    }

    .mobile-notice {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 20px;
      margin-top: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .mobile-notice p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.5;
      color: #ccc;
    }

    .mobile-notice img {
      height: 120px;
      width: auto;
      border-radius: 6px;
      border: 1px solid #444;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        text-align: center;
      }
      header h2 {
        text-align: center;
        margin-top: 10px;
        width: 100%;
      }
      header img {
        margin-right: 0;
      }
      .mobile-notice {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BYFFLZYS9K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BYFFLZYS9K');
  </script>
</head>
  
<body>

  <header>
      <img src="https://raw.githubusercontent.com/silviobonilha/vinhotinto/refs/heads/img_filo/sbonilha.jpg" alt="Prof. Silvio Bonilha" />
      <h2>Prof. Silvio Bonilha</h2>
  </header>

  <div class="mobile-notice">
      <p><strong>Dica de visualização:</strong> No caso de estar visualizando pelo celular, utilize o aparelho na horizontal para uma melhor experiência de leitura.</p>
      <img src="https://raw.githubusercontent.com/silviobonilha/vinhotinto/refs/heads/image/celular-2.png" 
           alt="Imagem celular" 
           title="Melhor posição para o Celular" />
  </div>

</body>
</html>
